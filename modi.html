<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت پشتیبانی - مارول سیتی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-5xl mx-auto">

    <!-- HEADER -->
    <header class="glass-card rounded-2xl p-4 flex items-center justify-between mb-4 shadow-xl">
        <div class="flex items-center gap-3">
            <a href="posht.html" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <h1 class="font-bold text-white text-base sm:text-lg">پنل مدیریت پشتیبانی</h1>
        </div>
        <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl font-bold">دسترسی مدیر</span>
    </header>

    <!-- MAIN CHAT PANEL -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-grow">
        
        <!-- USERS LIST -->
        <div class="glass-card rounded-2xl p-4 flex flex-col">
            <h3 class="font-bold text-slate-300 text-sm mb-3 pb-2 border-b border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users text-purple-400"></i> لیست پیام‌های کاربران
            </h3>
            <div id="users-list" class="space-y-2 overflow-y-auto flex-grow max-h-[70vh]">
                <p class="text-center text-slate-500 text-xs py-8">در حال دریافت کاربران...</p>
            </div>
        </div>

        <!-- PV CHAT WINDOW -->
        <div class="md:col-span-2 glass-card rounded-2xl p-4 flex flex-col justify-between min-h-[450px]">
            <div id="chat-header" class="pb-3 border-b border-slate-800">
                <h4 class="font-bold text-white text-sm" id="active-user-title">یک کاربر را از لیست سمت راست انتخاب کنید</h4>
            </div>

            <div id="admin-chat-messages" class="flex-grow overflow-y-auto space-y-3 my-4 pr-1 max-h-[55vh]">
                <p class="text-center text-slate-500 text-xs py-12">پیامی انتخاب نشده است.</p>
            </div>

            <!-- REPLY FORM -->
            <form id="reply-form" onsubmit="sendAdminReply(event)" class="pt-3 border-t border-slate-800 flex items-center gap-2 hidden">
                <input type="file" id="admin-image-input" accept="image/*" class="hidden" onchange="handleAdminImageUpload(event)">
                <button type="button" onclick="document.getElementById('admin-image-input').click()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-xl transition flex items-center justify-center" title="ارسال عکس">
                    <i class="fa-solid fa-image text-lg"></i>
                </button>
                <input type="text" id="admin-msg-input" placeholder="پاسخ مدیر..." class="flex-grow bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500">
                <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-3 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- IMAGE MODAL (LIGHTBOX) -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
        <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
            <button onclick="closeImageModal()" class="absolute -top-12 left-0 text-white text-xl bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modal-img" src="" alt="تصویر بزرگ" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl mb-4">
            <a id="modal-download-btn" href="" download target="_blank" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm flex items-center gap-2 transition shadow-lg">
                <i class="fa-solid fa-download"></i> دانلود عکس
            </a>
        </div>
    </div>

    <script>
        let selectedUser = null;

        async function loadUsersList() {
            try {
                const res = await fetch('/api/chat?action=get_users');
                const data = await res.json();
                const container = document.getElementById('users-list');

                if (data.users && data.users.length > 0) {
                    container.innerHTML = '';
                    data.users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = `p-3 rounded-xl bg-slate-800/80 hover:bg-purple-600/30 border border-slate-700/60 cursor-pointer transition flex items-center justify-between ${selectedUser === user.username ? 'border-purple-500 bg-purple-600/20' : ''}`;
                        div.onclick = () => openUserChat(user.username);
                        div.innerHTML = `
                            <div>
                                <h5 class="font-bold text-xs text-white">${user.username}</h5>
                                <p class="text-[11px] text-slate-400 truncate max-w-[150px] mt-0.5">${user.lastMessage || '...'}</p>
                            </div>
                            <span class="text-[9px] text-slate-500">${user.lastTime || ''}</span>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">هیچ پیامی یافت نشد.</p>`;
                }
            } catch (err) {
                console.error("خطا در دریافت لیست کاربران:", err);
            }
        }

        async function openUserChat(username) {
            selectedUser = username;
            document.getElementById('active-user-title').innerText = `پی‌وی کاربر: ${username}`;
            document.getElementById('reply-form').classList.remove('hidden');
            loadUsersList();
            loadAdminChatMessages();
        }

        async function loadAdminChatMessages() {
            if (!selectedUser) return;
            try {
                const res = await fetch(`/api/chat?action=get_messages&username=${selectedUser}`);
                const data = await res.json();
                const container = document.getElementById('admin-chat-messages');

                if (data.messages && Object.keys(data.messages).length > 0) {
                    container.innerHTML = '';
                    Object.values(data.messages).forEach(msg => {
                        const isAdmin = msg.sender === 'admin';
                        const div = document.createElement('div');
                        div.className = `flex flex-col ${isAdmin ? 'items-start' : 'items-end'}`;
                        
                        let contentHtml = '';
                        if (msg.imageUrl) {
                            contentHtml += `<div class="mb-2"><img src="${msg.imageUrl}" alt="تصویر" class="rounded-xl max-w-full max-h-60 object-cover cursor-pointer hover:opacity-95 transition" onclick="openImageModal('${msg.imageUrl}')"></div>`;
                        }
                        if (msg.text) {
                            contentHtml += `<div>${msg.text}</div>`;
                        }

                        div.innerHTML = `
                            <div class="${isAdmin ? 'bg-amber-500 text-slate-950 font-semibold rounded-br-2xl' : 'bg-slate-800 text-white border border-slate-700 rounded-bl-2xl'} p-3 rounded-2xl max-w-[80%] text-sm shadow">
                                ${contentHtml}
                            </div>
                            <span class="text-[10px] text-slate-500 mt-1 px-1">${msg.timestamp || ''}</span>
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">پیامی برای نمایش وجود ندارد.</p>`;
                }
            } catch (err) {
                console.error("خطا در دریافت چت کاربر:", err);
            }
        }

        async function sendAdminReply(e) {
            e.preventDefault();
            const input = document.getElementById('admin-msg-input');
            const text = input.value.trim();
            if (!text || !selectedUser) return;

            input.value = '';

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: selectedUser,
                        text: text,
                        sender: 'admin'
                    })
                });
                loadAdminChatMessages();
            } catch (err) {
                alert("خطا در ارسال پاسخ.");
            }
        }

        async function handleAdminImageUpload(e) {
            const file = e.target.files[0];
            if (!file || !selectedUser) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("حجم عکس نباید بیشتر از ۵ مگابایت باشد.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const base64Image = uploadEvent.target.result;
                
                const container = document.getElementById('admin-chat-messages');
                const loadingDiv = document.createElement('div');
                loadingDiv.id = 'admin-uploading-indicator';
                loadingDiv.className = 'flex flex-col items-start';
                loadingDiv.innerHTML = `<div class="bg-slate-800 text-amber-400 p-3 rounded-2xl text-xs flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin"></i> در حال آپلود و ارسال عکس...</div>`;
                container.appendChild(loadingDiv);
                container.scrollTop = container.scrollHeight;

                try {
                    const uploadRes = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Image })
                    });
                    const uploadData = await uploadRes.json();

                    if (!uploadData.success) {
                        throw new Error(uploadData.error || 'خطا در آپلود عکس');
                    }

                    await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: selectedUser,
                            text: '',
                            imageUrl: uploadData.url,
                            sender: 'admin'
                        })
                    });

                    document.getElementById('admin-uploading-indicator')?.remove();
                    e.target.value = '';
                    loadAdminChatMessages();
                } catch (err) {
                    document.getElementById('admin-uploading-indicator')?.remove();
                    alert("خطا در ارسال عکس: " + err.message);
                    e.target.value = '';
                }
            };
            reader.readAsDataURL(file);
        }

        function openImageModal(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const downloadBtn = document.getElementById('modal-download-btn');
            modalImg.src = url;
            downloadBtn.href = url;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        window.onload = function() {
            loadUsersList();
            setInterval(() => {
                loadUsersList();
                if (selectedUser) loadAdminChatMessages();
            }, 3000);
        };
    </script>
</body>
</html>

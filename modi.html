<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت پشتیبانی - مارول سیتی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-5xl mx-auto">

    <!-- HEADER -->
    <header class="glass-card rounded-2xl p-4 flex items-center justify-between mb-4 shadow-xl">
        <div class="flex items-center gap-3">
            <a href="posht.html" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <h1 class="font-bold text-white text-base sm:text-lg">پنل مدیریت پشتیبانی</h1>
        </div>
        <span class="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl font-bold">دسترسی مدیر</span>
    </header>

    <!-- MAIN CHAT PANEL (USERS LIST ONLY) -->
    <div class="flex flex-col flex-grow max-w-xl mx-auto w-full">
        <div class="glass-card rounded-2xl p-4 flex flex-col flex-grow">
            <h3 class="font-bold text-slate-300 text-sm mb-3 pb-2 border-b border-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-users text-purple-400"></i> لیست پیام‌های کاربران
            </h3>
            <div id="users-list" class="space-y-2 overflow-y-auto flex-grow max-h-[75vh]">
                <p class="text-center text-slate-500 text-xs py-8">در حال دریافت کاربران...</p>
            </div>
        </div>
    </div>

    <!-- CHAT POPUP MODAL (80% of screen) -->
    <div id="chat-modal" class="fixed inset-0 z-40 bg-black/80 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl w-full max-w-2xl h-[80vh] flex flex-col justify-between p-4 relative shadow-2xl border border-slate-700">
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <h4 class="font-bold text-white text-sm" id="active-user-title">پی‌وی کاربر</h4>
                <button onclick="closeChatModal()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Messages Container -->
            <div id="admin-chat-messages" class="flex-grow overflow-y-auto space-y-3 my-4 pr-1">
                <p class="text-center text-slate-500 text-xs py-12">پیامی انتخاب نشده است.</p>
            </div>

            <!-- IMAGE PREVIEW CONTAINER -->
            <div id="image-preview-container" class="hidden mb-3 p-3 bg-slate-800/90 rounded-xl border border-slate-700 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs text-amber-400 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-image"></i> پیش‌نمایش تصویر
                    </span>
                    <span id="image-size-label" class="text-[11px] text-slate-400"></span>
                </div>
                <div class="relative flex justify-center">
                    <img id="preview-img-tag" src="" alt="پیش‌نمایش" class="max-h-40 rounded-xl object-contain border border-slate-700">
                </div>
                <!-- Upload Progress Animation -->
                <div id="upload-progress-wrapper" class="hidden flex flex-col gap-1 mt-1">
                    <div class="flex justify-between text-[10px] text-slate-300">
                        <span id="upload-status-text">در حال ارسال...</span>
                        <span id="upload-percent">0%</span>
                    </div>
                    <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="upload-progress-bar" class="bg-amber-500 h-full w-0 transition-all duration-150"></div>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-2 mt-1" id="preview-actions">
                    <button type="button" onclick="cancelImagePreview()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs transition">انصراف</button>
                    <button type="button" onclick="confirmAndSendImage()" class="px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition flex items-center gap-1">
                        <i class="fa-solid fa-paper-plane"></i> ارسال عکس
                    </button>
                </div>
            </div>

            <!-- REPLY FORM -->
            <form id="reply-form" onsubmit="sendAdminReply(event)" class="pt-3 border-t border-slate-800 flex items-center gap-2">
                <input type="file" id="admin-image-input" accept="image/*" class="hidden" onchange="handleAdminImageSelect(event)">
                <button type="button" onclick="document.getElementById('admin-image-input').click()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-xl transition flex items-center justify-center" title="ارسال عکس">
                    <i class="fa-solid fa-image text-lg"></i>
                </button>
                <input type="text" id="admin-msg-input" placeholder="پاسخ مدیر..." class="flex-grow bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500">
                <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-3 rounded-xl transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- IMAGE MODAL (LIGHTBOX) -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
        <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
            <button onclick="closeImageModal()" class="absolute -top-12 left-0 text-white text-xl bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modal-img" src="" alt="تصویر بزرگ" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl mb-4">
            <a id="modal-download-btn" href="" download target="_blank" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm flex items-center gap-2 transition shadow-lg">
                <i class="fa-solid fa-download"></i> دانلود عکس
            </a>
        </div>
    </div>

    <script>
        let selectedUser = null;
        let pendingImageFile = null;
        let pendingImageBase64 = null;

        async function loadUsersList() {
            try {
                const res = await fetch('/api/chat?action=get_users');
                const data = await res.json();
                const container = document.getElementById('users-list');

                if (data.users && data.users.length > 0) {
                    // Sort users by newest message time first
                    data.users.sort((a, b) => new Date(b.lastTime || 0) - new Date(a.lastTime || 0));

                    container.innerHTML = '';
                    data.users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = `p-3 rounded-xl bg-slate-800/80 hover:bg-purple-600/30 border border-slate-700/60 cursor-pointer transition flex items-center justify-between ${selectedUser === user.username ? 'border-purple-500 bg-purple-600/20' : ''}`;
                        div.onclick = () => openUserChat(user.username);
                        
                        // Unread messages badge
                        const unreadBadge = (user.unreadCount && user.unreadCount > 0) 
                            ? `<span class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">${user.unreadCount}</span>` 
                            : '';

                        div.innerHTML = `
                            <div>
                                <h5 class="font-bold text-xs text-white">${user.username}</h5>
                                <p class="text-[11px] text-slate-400 truncate max-w-[180px] mt-0.5">${user.lastMessage || '...'}</p>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <span class="text-[9px] text-slate-500">${user.lastTime || ''}</span>
                                ${unreadBadge}
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">هیچ پیامی یافت نشد.</p>`;
                }
            } catch (err) {
                console.error("خطا در دریافت لیست کاربران:", err);
            }
        }

        async function openUserChat(username) {
            selectedUser = username;
            document.getElementById('active-user-title').innerText = `پی‌وی کاربر: ${username}`;
            document.getElementById('chat-modal').classList.remove('hidden');
            
            // Clear unread count locally when opened
            try {
                await fetch(`/api/chat?action=mark_read&username=${username}`);
            } catch (e) {}

            loadUsersList();
            loadAdminChatMessages();
        }

        function closeChatModal() {
            document.getElementById('chat-modal').classList.add('hidden');
            selectedUser = null;
            cancelImagePreview();
        }

        async function loadAdminChatMessages() {
            if (!selectedUser) return;
            try {
                const res = await fetch(`/api/chat?action=get_messages&username=${selectedUser}`);
                const data = await res.json();
                const container = document.getElementById('admin-chat-messages');

                if (data.messages && Object.keys(data.messages).length > 0) {
                    container.innerHTML = '';
                    Object.values(data.messages).forEach(msg => {
                        const isAdmin = msg.sender === 'admin';
                        const div = document.createElement('div');
                        div.className = `flex flex-col ${isAdmin ? 'items-start' : 'items-end'}`;
                        
                        let contentHtml = '';
                        if (msg.imageUrl) {
                            contentHtml += `<div class="mb-2"><img src="${msg.imageUrl}" alt="تصویر" class="rounded-xl max-w-full max-h-60 object-cover cursor-pointer hover:opacity-95 transition" onclick="openImageModal('${msg.imageUrl}')"></div>`;
                        }
                        if (msg.text) {
                            contentHtml += `<div>${msg.text}</div>`;
                        }

                        div.innerHTML = `
                            <div class="${isAdmin ? 'bg-amber-500 text-slate-950 font-semibold rounded-br-2xl' : 'bg-slate-800 text-white border border-slate-700 rounded-bl-2xl'} p-3 rounded-2xl max-w-[80%] text-sm shadow">
                                ${contentHtml}
                            </div>
                            <span class="text-[10px] text-slate-500 mt-1 px-1">${msg.timestamp || ''}</span>
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">پیامی برای نمایش وجود ندارد.</p>`;
                }
            } catch (err) {
                console.error("خطا در دریافت چت کاربر:", err);
            }
        }

        async function sendAdminReply(e) {
            e.preventDefault();
            const input = document.getElementById('admin-msg-input');
            const text = input.value.trim();
            if (!text || !selectedUser) return;

            input.value = '';

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: selectedUser,
                        text: text,
                        sender: 'admin'
                    })
                });
                loadAdminChatMessages();
                loadUsersList();
            } catch (err) {
                alert("خطا در ارسال پاسخ.");
            }
        }

        function handleAdminImageSelect(e) {
            const file = e.target.files[0];
            if (!file || !selectedUser) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("حجم عکس نباید بیشتر از ۵ مگابایت باشد.");
                e.target.value = '';
                return;
            }

            pendingImageFile = file;

            // Calculate and display file size
            let sizeStr = '';
            if (file.size < 1024 * 1024) {
                sizeStr = (file.size / 1024).toFixed(1) + ' کیلوبایت';
            } else {
                sizeStr = (file.size / (1024 * 1024)).toFixed(1) + ' مگابایت';
            }

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                pendingImageBase64 = uploadEvent.target.result;
                document.getElementById('preview-img-tag').src = pendingImageBase64;
                document.getElementById('image-size-label').innerText = `حجم عکس: ${sizeStr}`;
                
                // Reset states
                document.getElementById('upload-progress-wrapper').classList.add('hidden');
                document.getElementById('upload-progress-bar').style.width = '0%';
                document.getElementById('upload-percent').innerText = '0%';
                document.getElementById('preview-actions').classList.remove('hidden');
                
                // Show preview box
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function cancelImagePreview() {
            pendingImageFile = null;
            pendingImageBase64 = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('admin-image-input').value = '';
        }

        async function confirmAndSendImage() {
            if (!pendingImageBase64 || !selectedUser) return;

            document.getElementById('preview-actions').classList.add('hidden');
            const progressWrapper = document.getElementById('upload-progress-wrapper');
            progressWrapper.classList.remove('hidden');
            const progressBar = document.getElementById('upload-progress-bar');
            const percentText = document.getElementById('upload-percent');
            const statusText = document.getElementById('upload-status-text');

            // Simulate progress animation smoothly
            let progress = 0;
            const interval = setInterval(() => {
                progress += 12;
                if (progress > 90) progress = 90;
                progressBar.style.width = progress + '%';
                percentText.innerText = progress + '%';
            }, 100);

            try {
                statusText.innerText = 'در حال آپلود و ارسال...';
                const uploadRes = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: pendingImageBase64 })
                });
                const uploadData = await uploadRes.json();

                if (!uploadData.success) {
                    throw new Error(uploadData.error || 'خطا در آپلود عکس');
                }

                clearInterval(interval);
                progressBar.style.width = '100%';
                percentText.innerText = '100%';
                statusText.innerText = 'ارسال شد!';

                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: selectedUser,
                        text: '',
                        imageUrl: uploadData.url,
                        sender: 'admin'
                    })
                });

                setTimeout(() => {
                    cancelImagePreview();
                    loadAdminChatMessages();
                    loadUsersList();
                }, 400);

            } catch (err) {
                clearInterval(interval);
                alert("خطا در ارسال عکس: " + err.message);
                document.getElementById('preview-actions').classList.remove('hidden');
                progressWrapper.classList.add('hidden');
            }
        }

        function openImageModal(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const downloadBtn = document.getElementById('modal-download-btn');
            modalImg.src = url;
            downloadBtn.href = url;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        window.onload = function() {
            loadUsersList();
            setInterval(() => {
                loadUsersList();
                if (selectedUser) loadAdminChatMessages();
            }, 3000);
        };
    </script>
</body>
</html>

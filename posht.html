<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پشتیبانی آنلاین - مارول سیتی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-[100dvh] sm:min-h-screen flex flex-col justify-between p-2 sm:p-4 max-w-3xl mx-auto overflow-hidden sm:overflow-auto">

    <!-- HEADER -->
    <header class="glass-card rounded-2xl p-3 sm:p-4 flex items-center justify-between mb-2 sm:mb-4 shadow-xl flex-shrink-0">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div>
                <h1 class="font-bold text-white text-base sm:text-lg">پشتیبانی آنلاین</h1>
                <p id="user-info" class="text-xs text-purple-400">ارتباط مستقیم با مدیریت</p>
            </div>
        </div>
    </header>

    <!-- OFFICIAL NOTICE BANNER -->
    <div class="glass-card rounded-xl p-2.5 sm:p-3 mb-2 sm:mb-3 text-xs text-amber-300 flex items-center gap-2 border border-amber-500/20 flex-shrink-0 shadow-lg">
        <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
        <span>برای سفارش جدید، اول سفارش قبلی باید لغو بشه یا تکمیل بشه.</span>
    </div>

    <!-- CHAT BOX (80% Height on Mobile) -->
    <main class="glass-card rounded-2xl flex-grow p-3 sm:p-4 flex flex-col justify-between overflow-hidden relative h-[80vh] sm:h-auto max-h-[80vh] shadow-2xl">
        
        <!-- ORDER REVIEW / ACTIVE ORDER PANEL -->
        <div id="order-panel" class="hidden mb-3 bg-slate-800/90 border border-purple-500/30 rounded-2xl p-4 shadow-xl flex-shrink-0"></div>

        <div id="chat-messages" class="flex-grow overflow-y-auto space-y-3 pr-1 max-h-[calc(80vh-140px)]">
            <p class="text-center text-slate-500 text-xs py-8">در حال بارگذاری پیام‌ها...</p>
        </div>

        <!-- IMAGE PREVIEW CONTAINER -->
        <div id="image-preview-container" class="hidden mb-2 bg-slate-800/95 border border-purple-500/40 rounded-2xl p-3 flex items-center justify-between gap-3 shadow-xl flex-shrink-0">
            <div class="flex items-center gap-3">
                <img id="preview-thumb" src="" class="w-12 h-12 object-cover rounded-xl border border-slate-700">
                <div>
                    <p class="text-xs font-bold text-white">پیش‌نمایش تصویر</p>
                    <p id="preview-size" class="text-[10px] text-purple-400 font-mono mt-0.5"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="cancelImagePreview()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl text-xs transition">انصراف</button>
                <button type="button" onclick="confirmSendImage()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-purple-600/30">
                    <i class="fa-solid fa-paper-plane"></i> ارسال
                </button>
            </div>
        </div>

        <!-- INPUT FORM -->
        <form onsubmit="sendMessage(event)" class="mt-2 pt-2 border-t border-slate-800 flex items-center gap-2 flex-shrink-0">
            <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            <button type="button" onclick="document.getElementById('image-input').click()" class="bg-slate-800 hover:bg-slate-700 text-purple-400 p-3 rounded-xl transition flex items-center justify-center flex-shrink-0" title="انتخاب عکس">
                <i class="fa-solid fa-image text-lg"></i>
            </button>
            <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." class="flex-grow bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500">
            <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-3 rounded-xl transition flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </main>

    <!-- IMAGE MODAL (LIGHTBOX) -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
        <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
            <button onclick="closeImageModal()" class="absolute -top-12 left-0 text-white text-xl bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modal-img" src="" alt="تصویر بزرگ" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl mb-4">
            <a id="modal-download-btn" href="" download target="_blank" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm flex items-center gap-2 transition shadow-lg">
                <i class="fa-solid fa-download"></i> دانلود عکس
            </a>
        </div>
    </div>

    <script>
        let currentUser = null;
        let selectedImageFile = null;

        function checkUser() {
            const saved = localStorage.getItem('app_user');
            if (!saved) {
                alert("لطفاً ابتدا ثبت نام کنید.");
                window.location.href = "index.html";
                return;
            }
            currentUser = JSON.parse(saved);
            document.getElementById('user-info').innerText = `کاربر: ${currentUser.username}`;
            checkOrderPanel();
            loadMessages();
            setInterval(loadMessages, 3000);
        }

        function formatPrice(value) {
            if (value === null || value === undefined || value === '') return '۰';
            let str = value.toString().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
            let numStr = str.replace(/[^0-9]/g, '');
            if (!numStr) return '۰';
            let formatted = parseInt(numStr, 10).toLocaleString('en-US').replace(/,/g, '،');
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return formatted.replace(/\d/g, x => persianDigits[x]);
        }

        function getProductRawPrice(item) {
            let pStr = item.priceDiscount || item.priceSingle || item.priceMain || '0';
            let numStr = pStr.toString().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^0-9]/g, '');
            return parseInt(numStr, 10) || 0;
        }

        function checkOrderPanel() {
            const panel = document.getElementById('order-panel');
            const pendingOrderStr = localStorage.getItem('pending_order');
            const activeOrderStr = localStorage.getItem('active_order');

            if (activeOrderStr) {
                const order = JSON.parse(activeOrderStr);
                let itemsHtml = order.items.map(item => `
                    <div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
                        <img src="${item.mainImg || ''}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0" onerror="this.src='https://placehold.co/100x100/1e293b/a855f7?text=Product'">
                        <div class="flex-grow">
                            <h5 class="font-bold text-white text-xs">${item.name || ''}</h5>
                            <p class="text-[11px] text-slate-300 line-clamp-1">${item.desc || 'بدون توضیحات'}</p>
                            <div class="flex justify-between items-center mt-1 text-[11px]">
                                <span class="text-amber-400 font-semibold">${formatPrice(getProductRawPrice(item))} تومان</span>
                                <span class="bg-purple-600/30 text-purple-300 px-2 py-0.5 rounded font-mono text-[10px]">کد رهگیری: ${item.trackingCode || 'حذف شده'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                panel.className = "mb-3 bg-slate-800/90 border border-emerald-500/30 rounded-2xl p-4 shadow-xl flex-shrink-0";
                panel.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-emerald-400"><i class="fa-solid fa-circle-check ml-1"></i> سفارش ارسال شده برای پشتیبانی</h3>
                        <span class="text-[10px] text-slate-400">${order.timestamp}</span>
                    </div>
                    <div class="space-y-2 mb-3 max-h-40 overflow-y-auto pr-1">${itemsHtml}</div>
                    <div class="flex justify-between items-center text-xs font-bold text-slate-300 pt-2 border-t border-slate-700">
                        <span>مجموع کل: <span class="text-amber-400">${formatPrice(order.totalPrice)} تومان</span></span>
                        <button onclick="cancelActiveOrder()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 px-3 py-1.5 rounded-xl transition text-xs font-bold flex items-center gap-1">
                            <i class="fa-solid fa-ban"></i> لغو سفارش
                        </button>
                    </div>
                `;
                panel.classList.remove('hidden');
            } else if (pendingOrderStr) {
                const items = JSON.parse(pendingOrderStr);
                if (items.length === 0) {
                    panel.classList.add('hidden');
                    return;
                }

                let totalPrice = 0;
                let itemsHtml = items.map(item => {
                    const rawPrice = getProductRawPrice(item);
                    totalPrice += rawPrice;
                    return `
                        <div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
                            <img src="${item.mainImg || ''}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0" onerror="this.src='https://placehold.co/100x100/1e293b/a855f7?text=Product'">
                            <div class="flex-grow">
                                <h5 class="font-bold text-white text-xs">${item.name || ''}</h5>
                                <p class="text-[11px] text-slate-300 line-clamp-1">${item.desc || 'بدون توضیحات'}</p>
                                <span class="text-amber-400 font-semibold text-[11px]">${formatPrice(rawPrice)} تومان</span>
                            </div>
                        </div>
                    `;
                }).join('');

                panel.className = "mb-3 bg-slate-800/90 border border-purple-500/30 rounded-2xl p-4 shadow-xl flex-shrink-0";
                panel.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-bold text-purple-400"><i class="fa-solid fa-basket-shopping ml-1"></i> محصولات سبد خرید (آماده ارسال)</h3>
                    </div>
                    <div class="space-y-2 mb-3 max-h-40 overflow-y-auto pr-1">${itemsHtml}</div>
                    <div class="flex justify-between items-center text-xs font-bold text-slate-300 pt-2 border-t border-slate-700">
                        <span>مجموع کل: <span class="text-amber-400">${formatPrice(totalPrice)} تومان</span></span>
                        <button onclick="sendCartOrderToSupport()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-4 py-2 rounded-xl transition text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-purple-600/30">
                            <i class="fa-solid fa-paper-plane"></i> ارسال سفارش برای پشتیبانی
                        </button>
                    </div>
                `;
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        async function sendCartOrderToSupport() {
            const pendingOrderStr = localStorage.getItem('pending_order');
            if (!pendingOrderStr || !currentUser) return;

            const items = JSON.parse(pendingOrderStr);
            let totalPrice = 0;
            items.forEach(item => {
                totalPrice += getProductRawPrice(item);
            });

            let trackingCodes = [];
            try {
                const res = await fetch('/api/tracking_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: items.length })
                });
                const data = await res.json();
                if (data.success && data.codes) {
                    trackingCodes = data.codes;
                } else {
                    throw new Error(data.error || 'خطا در دریافت کد رهگیری');
                }
            } catch (err) {
                alert("خطا در دریافت کد رهگیری: " + err.message);
                return;
            }

            const processedItems = items.map((item, index) => {
                return {
                    ...item,
                    trackingCode: trackingCodes[index] || (1000 + index).toString()
                };
            });

            const order = {
                id: 'ORD-' + Date.now(),
                items: processedItems,
                totalPrice: totalPrice,
                timestamp: new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })
            };

            localStorage.setItem('active_order', JSON.stringify(order));
            localStorage.removeItem('pending_order');

            currentUser.cart = [];
            localStorage.setItem('app_user', JSON.stringify(currentUser));
            try {
                await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'syncCart', username: currentUser.username, cart: [] })
                });
            } catch(e) {}

            let orderHtmlSummary = `📦 <b>ثبت سفارش جدید از سبد خرید:</b><br><div class="space-y-2 mt-2">`;
            processedItems.forEach(item => {
                const rawPrice = getProductRawPrice(item);
                orderHtmlSummary += `
                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700 flex items-center gap-3">
                        <img src="${item.mainImg || ''}" class="w-14 h-14 object-cover rounded-lg flex-shrink-0" onerror="this.src='https://placehold.co/100x100/1e293b/a855f7?text=Product'">
                        <div class="flex-grow">
                            <h5 class="font-bold text-white text-xs">${item.name || ''}</h5>
                            <p class="text-[11px] text-slate-300 line-clamp-1 mt-0.5">${item.desc || 'بدون توضیحات'}</p>
                            <div class="flex justify-between items-center mt-1 text-[11px]">
                                <span class="text-amber-400 font-semibold">${formatPrice(rawPrice)} تومان</span>
                                <span class="bg-purple-600/30 text-purple-300 px-2 py-0.5 rounded font-mono text-[10px]">کد رهگیری: ${item.trackingCode}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            orderHtmlSummary += `</div><div class="mt-3 pt-2 border-t border-slate-700 flex justify-between items-center text-xs font-bold"><span>مجموع کل:</span><span class="text-amber-400 text-sm">${formatPrice(totalPrice)} تومان</span></div>`;

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        text: orderHtmlSummary,
                        sender: 'user'
                    })
                });
            } catch (err) {}

            checkOrderPanel();
            loadMessages();
        }

        async function cancelActiveOrder() {
            const activeOrderStr = localStorage.getItem('active_order');
            if (!activeOrderStr || !currentUser) return;

            localStorage.removeItem('active_order');

            let cancelTextSummary = `❌ سفارش توسط کاربر لغو شد و کدهای رهگیری محصولات حذف گردیدند.`;

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        text: cancelTextSummary,
                        sender: 'user'
                    })
                });
            } catch (err) {}

            checkOrderPanel();
            loadMessages();
        }

        async function loadMessages() {
            if (!currentUser) return;
            try {
                const res = await fetch(`/api/chat?action=get_messages&username=${currentUser.username}`);
                const data = await res.json();
                const container = document.getElementById('chat-messages');

                if (data.messages && Object.keys(data.messages).length > 0) {
                    container.innerHTML = '';
                    Object.values(data.messages).forEach(msg => {
                        const isUser = msg.sender === 'user';
                        const div = document.createElement('div');
                        div.className = `flex flex-col ${isUser ? 'items-start' : 'items-end'}`;
                        
                        let contentHtml = '';
                        if (msg.imageUrl) {
                            contentHtml += `<div class="mb-2"><img src="${msg.imageUrl}" alt="تصویر" class="rounded-xl max-w-full max-h-60 object-cover cursor-pointer hover:opacity-95 transition" onclick="openImageModal('${msg.imageUrl}')"></div>`;
                        }
                        if (msg.text) {
                            contentHtml += `<div>${msg.text}</div>`;
                        }

                        div.innerHTML = `
                            <div class="${isUser ? 'bg-purple-600/80 text-white rounded-br-2xl' : 'bg-slate-800 text-emerald-300 border border-slate-700 rounded-bl-2xl'} p-3 rounded-2xl max-w-[85%] text-sm shadow">
                                ${contentHtml}
                            </div>
                            <span class="text-[10px] text-slate-500 mt-1 px-1">${msg.timestamp || ''}</span>
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">هنوز پیامی ارسال نکرده‌اید. پیام خود را بفرستید.</p>`;
                }
            } catch (err) {}
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            input.value = '';

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        text: text,
                        sender: 'user'
                    })
                });
                loadMessages();
            } catch (err) {
                alert("خطا در ارسال پیام.");
            }
        }

        // Image Handling with Preview, Size & Animation
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert("حجم عکس نباید بیشتر از ۵ مگابایت باشد.");
                e.target.value = '';
                return;
            }

            selectedImageFile = file;
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                document.getElementById('preview-thumb').src = uploadEvent.target.result;
                document.getElementById('preview-size').innerText = formatFileSize(file.size);
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function cancelImagePreview() {
            selectedImageFile = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-input').value = '';
        }

        async function confirmSendImage() {
            if (!selectedImageFile || !currentUser) return;

            const base64Image = document.getElementById('preview-thumb').src;
            const fileSizeText = formatFileSize(selectedImageFile.size);

            document.getElementById('image-preview-container').classList.add('hidden');

            const container = document.getElementById('chat-messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'uploading-indicator';
            loadingDiv.className = 'flex flex-col items-start w-full';
            loadingDiv.innerHTML = `
                <div class="bg-slate-800 text-purple-300 p-3 rounded-2xl text-xs flex flex-col gap-2 w-full max-w-xs border border-purple-500/30 shadow-lg">
                    <div class="flex items-center justify-between">
                        <span class="flex items-center gap-2">
                            <i class="fa-solid fa-circle-notch fa-spin text-purple-400 text-sm"></i>
                            <span>در حال ارسال عکس (${fileSizeText})...</span>
                        </span>
                        <span class="font-mono text-[10px] text-purple-400 animate-pulse">لطفاً صبر کنید</span>
                    </div>
                    <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-purple-500 to-indigo-500 h-full rounded-full animate-pulse w-3/4"></div>
                    </div>
                </div>
            `;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const uploadRes = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });
                const uploadData = await uploadRes.json();
                if (!uploadData.success) throw new Error(uploadData.error || 'خطا در آپلود عکس');

                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser.username,
                        text: '',
                        imageUrl: uploadData.url,
                        sender: 'user'
                    })
                });

                document.getElementById('uploading-indicator')?.remove();
                selectedImageFile = null;
                document.getElementById('image-input').value = '';
                loadMessages();
            } catch (err) {
                document.getElementById('uploading-indicator')?.remove();
                alert("خطا در ارسال عکس: " + err.message);
                selectedImageFile = null;
                document.getElementById('image-input').value = '';
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 بایت';
            const k = 1024;
            const sizes = ['بایت', 'کیلوبایت', 'مگابایت'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function openImageModal(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const downloadBtn = document.getElementById('modal-download-btn');
            modalImg.src = url;
            downloadBtn.href = url;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        window.onload = checkUser;
    </script>
</body>
</html>

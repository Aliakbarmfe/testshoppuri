<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه آنلاین</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: #f8f9fa; color: #333; line-height: 1.6; }

    header { background: #111; color: white; padding: 20px; text-align: center; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* ناوبری بخش‌ها */
    .nav-tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; background: #e9ecef; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active { background: #007bff; color: white; }

    .section-title { font-size: 1.5rem; margin: 30px 0 15px; border-right: 4px solid #007bff; padding-right: 10px; }

    /* گرید محصولات */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
    .product-card:hover { transform: translateY(-5px); }
    
    .product-img-wrapper { position: relative; width: 100%; height: 180px; border-radius: 8px; overflow: hidden; background: #eee; }
    .product-img { width: 100%; height: 100%; object-fit: cover; }
    .product-badge { position: absolute; top: 10px; right: 10px; background: #ffc107; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

    .product-info { margin-top: 12px; }
    .product-name { font-size: 1rem; font-weight: bold; margin-bottom: 8px; }
    
    .price-box { margin-top: 10px; }
    .price-main-old { text-decoration: line-through; color: #888; font-size: 0.85rem; }
    .price-discount-new { color: #e63946; font-size: 1.2rem; font-weight: bold; }
    .price-single { color: #2b2d42; font-size: 1.1rem; font-weight: bold; }

    /* مودم جزئیات محصول */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal.active { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 600px; max-height: 90vh; border-radius: 12px; overflow-y: auto; padding: 20px; position: relative; }
    .close-modal { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }

    /* اسکرول افقی عکس‌های اضافی */
    .extra-imgs-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth; }
    .extra-img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; flex-shrink: 0; border: 1px solid #ddd; }

    .card-info-box { background: #f1f3f5; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9rem; }
    .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: not-allowed; opacity: 0.7; font-size: 1rem; }
    .btn-add { background: #6c757d; color: white; }
    .btn-order { background: #adb5bd; color: white; }

    /* فوتر */
    footer { background: #212529; color: white; padding: 30px 20px; text-align: center; margin-top: 50px; }
    .channel-link { display: inline-block; margin-top: 15px; background: #0088cc; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>فروشگاه آنلاین</h1>
  </header>

  <div class="container">
    <!-- تب‌های دسته‌بندی -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchSection('home')">صفحه اصلی</button>
      <button class="tab-btn" onclick="switchSection('cod')">کالاف دیوتی</button>
      <button class="tab-btn" onclick="switchSection('cp')">سی پی</button>
      <button class="tab-btn" onclick="switchSection('gap_channel')">گپ و چنل</button>
    </div>

    <!-- بخش نمایش محصولات -->
    <div id="sectionContainer"></div>
  </div>

  <!-- مودم جزئیات محصول -->
  <div class="modal" id="productModal">
    <div class="modal-content" id="modalBodyContent">
      <!-- محتوا داینامیک تزریق می‌شود -->
    </div>
  </div>

  <!-- فوتر -->
  <footer>
    <p id="footerDesc">در حال بارگذاری توضیحات سایت...</p>
    <a id="footerChannelBtn" href="#" target="_blank" class="channel-link" style="display: none;">ورود به کانال تلگرام</a>
  </footer>

  <script>
    let activeCategory = 'home';
    let allProductsData = {};
    let autoScrollInterval = null;

    async function fetchAPI(path) {
      try {
        const res = await fetch(`/api/firebase?path=${path}`);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function loadSettings() {
      const desc = await fetchAPI('settings/siteDescription');
      if (desc) document.getElementById('footerDesc').innerText = desc;

      const channel = await fetchAPI('settings/channelLink');
      if (channel) {
        const btn = document.getElementById('footerChannelBtn');
        btn.href = channel;
        btn.style.display = 'inline-block';
      }
    }

    async function switchSection(category) {
      activeCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const container = document.getElementById('sectionContainer');
      container.innerHTML = '<div style="text-align:center; padding:30px;">در حال بارگذاری محصولات...</div>';

      const data = await fetchAPI(`products/${category}`);
      allProductsData = data || {};

      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('sectionContainer');
      container.innerHTML = '';

      if (!allProductsData || Object.keys(allProductsData).length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#666;">محصولی در این بخش وجود ندارد.</div>';
        return;
      }

      let gridHtml = '<div class="products-grid">';
      for (const [id, item] of Object.entries(allProductsData)) {
        let priceHtml = '';
        if (activeCategory === 'home') {
          priceHtml = `
            <div class="price-box">
              <div class="price-main-old">${item.priceMain ? item.priceMain.toLocaleString() + ' تومان' : ''}</div>
              <div class="price-discount-new">${item.priceDiscount ? item.priceDiscount.toLocaleString() + ' تومان' : ''}</div>
            </div>
          `;
        } else {
          priceHtml = `
            <div class="price-box">
              <div class="price-single">${item.priceSingle ? item.priceSingle.toLocaleString() + ' تومان' : 'تماس بگیرید'}</div>
            </div>
          `;
        }

        gridHtml += `
          <div class="product-card" onclick="openProductModal('${id}')">
            <div>
              <div class="product-img-wrapper">
                <img src="${item.mainImg || ''}" class="product-img" alt="${item.name}">
                ${item.tag ? `<span class="product-badge">${item.tag}</span>` : ''}
              </div>
              <div class="product-info">
                <div class="product-name">${item.name}</div>
              </div>
            </div>
            ${priceHtml}
          </div>
        `;
      }
      gridHtml += '</div>';
      container.innerHTML = gridHtml;
    }

    function openProductModal(id) {
      const item = allProductsData[id];
      if (!item) return;

      let extraImgsHtml = '';
      if (item.extraImgs && item.extraImgs.length > 0) {
        extraImgsHtml = `
          <div style="margin: 15px 0;">
            <label style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;">تصاویر بیشتر:</label>
            <div class="extra-imgs-container" id="extraImgsScroll">
              ${item.extraImgs.map(img => `<img src="${img}" class="extra-img">`).join('')}
            </div>
          </div>
        `;
      }

      let priceDetailsHtml = '';
      if (activeCategory === 'home') {
        priceDetailsHtml = `
          <div style="margin: 10px 0;">
            <span class="price-main-old">قیمت اصلی: ${item.priceMain ? item.priceMain.toLocaleString() + ' تومان' : ''}</span><br>
            <span class="price-discount-new">قیمت با تخفیف: ${item.priceDiscount ? item.priceDiscount.toLocaleString() + ' تومان' : ''}</span>
          </div>
        `;
      } else {
        priceDetailsHtml = `
          <div style="margin: 10px 0;">
            <span class="price-single">قیمت: ${item.priceSingle ? item.priceSingle.toLocaleString() + ' تومان' : ''}</span>
          </div>
        `;
      }

      const modalContent = document.getElementById('modalBodyContent');
      modalContent.innerHTML = `
        <button class="close-modal" onclick="closeProductModal()">&times;</button>
        <h2 style="margin-bottom: 10px;">${item.name}</h2>
        <img src="${item.mainImg}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 8px;">
        
        ${priceDetailsHtml}
        ${extraImgsHtml}

        <div style="margin: 15px 0;">
          <h4 style="font-size: 0.95rem; margin-bottom: 5px;">توضیحات:</h4>
          <p style="font-size: 0.9rem; color: #555; white-space: pre-line;">${item.desc || 'توضیحاتی ثبت نشده است.'}</p>
        </div>

        <div class="card-info-box">
          <div><strong>شماره کارت:</strong> ${item.cardNum || 'ثبت نشده'}</div>
          <div style="margin-top: 5px;"><strong>صاحب کارت:</strong> ${item.cardName || 'ثبت نشده'}</div>
        </div>

        <div class="action-buttons">
          <button class="btn btn-add" disabled>افزودن</button>
          <button class="btn btn-order" disabled>ثبت سفارش</button>
        </div>
      `;

      document.getElementById('productModal').classList.add('active');

      // راه‌اندازی اسکرول افقی خودکار عکس‌های اضافی
      startAutoScroll();
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
      if (autoScrollInterval) clearInterval(autoScrollInterval);
    }

    function startAutoScroll() {
      const scrollContainer = document.getElementById('extraImgsScroll');
      if (!scrollContainer) return;

      if (autoScrollInterval) clearInterval(autoScrollInterval);

      autoScrollInterval = setInterval(() => {
        if (scrollContainer.scrollLeft + scrollContainer.clientWidth >= scrollContainer.scrollWidth - 5) {
          scrollContainer.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          scrollContainer.scrollBy({ left: 120, behavior: 'smooth' });
        }
      }, 3000);
    }

    // بارگذاری اولیه صفحه اصلی و تنظیمات
    window.onload = async () => {
      await loadSettings();
      // لود پیش‌فرض صفحه اصلی
      const data = await fetchAPI('products/home');
      allProductsData = data || {};
      renderProducts();
    };
  </script>
</body>
</html>
